      var qr = quizResult();
      S.favManual = qr.fav; S.unfManual = qr.unf;
      try { localStorage.setItem('xieji.favor', JSON.stringify({ fav: S.favManual, unf: S.unfManual })); } catch (e) { }
      S.sheet = '';
      toast('已按测试结果设定喜忌');
      render(); return;
    }
    if (k === 'poster') {
      try {
        S.poster = makePoster(day(), S.scoreS, S.relNow);
        S.sheet = 'poster';
        render();
      } catch (e) {
        toast('生成失败：' + e.message);
      }
      return;
    }
    if (k === 'copyprompt' || k === 'shareposter') {
      var full = POSTER_PROMPT + '\n' + (S.posterText || '');
      var copyIt = function () {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(full).then(function () {
              toast('提示词与文字已复制，去豆包/DeepSeek 粘贴即可');
            }).catch(function () { fallbackCopy(full); });
          } else fallbackCopy(full);
        } catch (e) { fallbackCopy(full); }
      };
      if (k === 'copyprompt') { copyIt(); return; }
      /* 系统分享：带图片 + 提示词；不支持时退回复制 */
      fetch(S.poster).then(function (res) { return res.blob(); }).then(function (blob) {
        var file = new File([blob], 'xieji-huangli.png', { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          navigator.share({ files: [file], title: '协纪黄历', text: full })
            .then(function () { toast('已打开分享，选豆包或 DeepSeek'); })
            .catch(function () { copyIt(); });
        } else {
          copyIt();
          setTimeout(function () { toast('系统不支持带图分享：已复制文字，图片请长按保存'); }, 1200);
        }
      }).catch(function () { copyIt(); });
      return;
    }
    if (k === 'wtog') {
      var kind = p[1], idx = +p[2];
      var arr = kind === 'fav' ? S.favManual : S.unfManual;
      if (!arr) arr = kind === 'fav' ? (S.favManual = []) : (S.unfManual = []);
      var at = arr.indexOf(idx);
      if (at >= 0) arr.splice(at, 1); else arr.push(idx);
      render(); return;
    }
    if (k === 'favsave') {
      try {
        localStorage.setItem('xieji.favor', JSON.stringify({ fav: S.favManual, unf: S.unfManual }));
      } catch (e) { }
      S.sheet = '';
      toast('已保存喜忌设定');
      render(); return;
    }
    if (k === 'favreset') {
      S.favManual = null; S.unfManual = null;
      try { localStorage.removeItem('xieji.favor'); } catch (e) { }
      toast('已恢复系统判定');
      render(); return;
    }
    if (k === 'yili') { S.qName = decodeURIComponent(p[1] || ''); S.sheet = 'yili'; render(); return; }
    if (k === 'bmode') { S.bMode = (p[1] === 'solar') ? 'solar' : 'lunar'; render(); return; }
    if (k === 'cpmode') {
      S.cp = S.cp || {};
      S.cp.mode = (p[1] === 'lunar') ? 'lunar' : 'solar';
      render(); return;
    }
    if (k === 'installhelp') {
      window.open('./install.html', '_blank');
      return;
    }
    if (k === 'pmode') {
      S.pMode = p[1] === 'zodiac' ? 'zodiac' : (p[1] === 'bazi' ? 'bazi' : 'generic');
      try { localStorage.setItem('xieji.pmode', S.pMode); } catch (e) { }
      render(); return;
    }
    if (k === 'clear') {
      try { localStorage.clear(); } catch (e) { }
      var done = function () { toast('已清理，正在重载'); setTimeout(function () { location.reload(); }, 400); };
      if (window.caches && caches.keys) {
        caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (x) { return caches.delete(x); }));
        }).then(done).catch(done);
      } else done();
      return;
    }
    if (k === 'quit') {
      window.close();
      setTimeout(function () {
        toast('浏览器不允许脚本关闭页面，请用系统手势退出');
      }, 300);
      return;
    }
    if (k === 'hehun') {
      var cp = S.cp || {};
      if (!cp.a || !cp.b) { toast('请先填两人的公历生日'); return; }
      var pa = cp.a.split('-').map(Number), pb = cp.b.split('-').map(Number);
      if (pa.length !== 3 || pb.length !== 3) { toast('日期格式不对'); return; }
      try {
        var bm = E.baziOf(pa[0], pa[1], pa[2], (cp.ah === '' || cp.ah === undefined) ? null : +cp.ah);
        var bf = E.baziOf(pb[0], pb[1], pb[2], (cp.bh === '' || cp.bh === undefined) ? null : +cp.bh);
        S.cp.res = { m: bm, f: bf, r: E.hehun(bm, bf) };
        render();
      } catch (err) { toast('推算失败：' + (err && err.message ? err.message : '')); }
      return;
    }
    if (k === 'savebirth') {
      if (!birthKnown()) {
        /* 年/月/日任一不详：只记「不详」，不算八字 */
        saveBirth();
        S.bz = null;
        S.zodiac = null;
        saveZodiac(null);
        S.sheet = '';
        toast('生日已记为「不详」，黄历按通用模式显示');
        render(); return;
      }
      var jdnB = E.lunarToJDN(S.bY, S.bM, S.bD, S.bLeap);
      if (jdnB === null) { toast('没找到这个农历日子'); return; }
      var gB = E.jdnToGregorian(jdnB);
      /* 生肖按农历年（春节）定：1984 甲子，顺推 */
      var zhiB = (((S.bY - 1984) % 12) + 12) % 12;
      try {
        E.computeDay(gB.year, gB.month, gB.day);
        saveZodiac(zhiB);
        saveBirth();
        S.bz = bzNow();
        S.sheet = '';
        var bt = S.bz ? '　四柱：' + S.bz.yearText + ' ' + S.bz.monthText + ' ' + S.bz.dayText + (S.bz.hourText ? ' ' + S.bz.hourText : '') : '';
        toast('农历' + S.bY + '年' + (S.bLeap ? '闰' : '') + lunarMonthName(S.bM) + lunarDayName(S.bD) +
          '（' + gB.year + '-' + gB.month + '-' + gB.day + '）→ 属' + ANIMALS[zhiB] + bt);
        render(); return;
      } catch (e) { toast('该日期超出范围（1900–2100）'); return; }
    }
  });

  document.addEventListener('change', function (e) {
    var id = e.target && e.target.id;
    if (id === 'zmonth' && e.target.value) {
      S.zMonth = e.target.value; S.zMode = 'month'; render(); return;
    }
    if (id === 'by') {
      if (e.target.value === '') { S.bY = null; S.bM = null; S.bD = null; render(); return; }
      S.bY = +e.target.value;
      S.bM = null; S.bD = null; S.bLeap = false;   /* 月日仍不详，等用户自己选 */
      render(); return;
    }
    if (id === 'bm') {
      if (e.target.value === '') { S.bM = null; S.bD = null; render(); return; }
      var ms2 = E.lunarMonthsOf(S.bY);
      var m2 = ms2[+e.target.value];
      if (m2) { S.bM = m2.month; S.bLeap = m2.leap; S.bD = null; }   /* 日仍不详 */
      render(); return;
    }
    if (id === 'bd') {
      S.bD = e.target.value === '' ? null : +e.target.value;
      return;
    }
    if (id === 'bh') { S.bHz = e.target.value === '' ? null : +e.target.value; return; }
    if (id === 'bg') { S.bMale = e.target.value === '1'; saveBirth(); render(); return; }
    if (id === 'caly') { S.calY = +e.target.value; render(); return; }
    if (id === 'calm') { S.calM = +e.target.value; render(); return; }
    if (id === 'cpa' || id === 'cpb' || id === 'cpah' || id === 'cpbh') {
      S.cp = S.cp || {};
      if (id === 'cpa') S.cp.a = e.target.value;
      else if (id === 'cpb') S.cp.b = e.target.value;
      else if (id === 'cpah') S.cp.ah = e.target.value;
      else S.cp.bh = e.target.value;
      S.cp.res = null;
      return;
    }
    if (/^cp[ab][YMD]$/.test(id)) {
      var ck = id.charAt(2);
      var yEl = document.getElementById('cp' + ck + 'Y');
      var mEl = document.getElementById('cp' + ck + 'M');
      var dEl = document.getElementById('cp' + ck + 'D');
      if (!yEl || !mEl || !dEl) return;
      var lyy = +yEl.value, lmi = +mEl.value, ldd = +dEl.value;
      var lms = E.lunarMonthsOf(lyy);
      var lmm = lms[lmi] || lms[0];
      var ljdn = E.lunarToJDN(lyy, lmm.month, Math.min(ldd, lmm.days), lmm.leap);
      if (ljdn === null || ljdn === undefined) return;
      var lg = E.jdnToGregorian(ljdn);
      S.cp = S.cp || {};
      S.cp[ck] = lg.year + '-' + pad(lg.month) + '-' + pad(lg.day);
      S.cp.res = null;
      render();
      return;
    }
    if (id === 'bsolar' && e.target.value) {
      var sp = e.target.value.split('-').map(Number);
      if (sp.length === 3) {
        try {
          var lu = E.toLunar(E.gregorianToJDN(sp[0], sp[1], sp[2]));
          S.bY = lu.year; S.bM = lu.month; S.bD = lu.day; S.bLeap = !!lu.leap;
          render(); return;
        } catch (err) { }
      }
    }
  });

  function bootHash() {
    var h = (location.hash || '').replace(/^#/, '');
    if (!h) return false;
    var pairs = h.split('&'), any = false;
    pairs.forEach(function (seg) {
      var kv = seg.split('=');
      var k = kv[0], v = kv[1];
      if (k === 'tab' && TITLES[v]) { S.tab = v; any = true; }
      else if (k === 'sheet') { S.sheet = v; any = true; }
      else if (k === 'date' && v) {
        var p = v.split('-').map(Number);
        if (p.length === 3) { S.y = p[0]; S.m = p[1]; S.d = p[2]; S.calY = p[0]; S.calM = p[1]; any = true; }
      } else if (k === 'birth' && v) {
        var q = v.split('-').map(Number);
        if (q.length >= 3) {
          try {
            S.bz = E.baziOf(q[0], q[1], q[2], q.length > 3 ? q[3] : null);
            S.zodiac = S.bz.shengxiao;
            var _lu = E.toLunar(E.gregorianToJDN(q[0], q[1], q[2]));
            S.bY = _lu.year; S.bM = _lu.month; S.bD = _lu.day; S.bLeap = !!_lu.leap;
            if (q.length > 3) S.bHz = q[3];
            any = true;
          } catch (e) { }
        }
      }
    });
    return any;
  }
  bootHash();
  window.addEventListener('hashchange', function () { bootHash(); render(); });

  render();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
