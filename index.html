<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="协纪黄历">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F7F2E9">
<title>协纪黄历 · 老黄历</title>
<style>
:root{
  --paper:#F7F2E9; --card:#FFFDF8; --ink:#2B2622; --ink2:#6B6259; --ink3:#A2968A;
  --red:#B3202A; --red-deep:#8C1620; --gold:#C0A062; --line:#EFE5D4;
  --shadow:0 6px 22px rgba(120,96,60,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#E9E1D2; font-family:-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  color:var(--ink); font-size:14px; line-height:1.6;
  display:flex; justify-content:center; align-items:flex-start; min-height:100vh;
}
.serif{font-family:"Songti SC","STSong","SimSun",Georgia,serif}
#app{width:390px;height:844px;max-height:100vh;background:var(--paper);position:relative;overflow:hidden;
  box-shadow:0 20px 60px rgba(60,40,20,.18);display:flex;flex-direction:column}
@media (max-width:430px){#app{width:100vw;height:100vh;box-shadow:none}body{background:var(--paper)}}

.navbar{height:52px;display:flex;align-items:center;justify-content:center;font-size:22px;
  font-weight:600;letter-spacing:3px;color:var(--ink);position:sticky;top:0;z-index:30;
  background:rgba(247,242,233,.92);backdrop-filter:blur(8px)}
.scroll{flex:1;overflow-y:auto;padding-bottom:74px;-webkit-overflow-scrolling:touch}
.wrap{padding:0 14px}

.datebar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 0 4px;
  font-size:13px;color:var(--ink2)}
.datebar .pick{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:14px;background:#EFE7D6;cursor:pointer}
.caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink3)}

.hero{position:relative;text-align:center;padding:6px 0 0}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.arrow{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--red);font-size:20px;background:transparent;border:none;cursor:pointer;font-family:inherit}
.arrow:active{background:#EFE7D6}
.lunar-big{font-size:42px;line-height:1.15;color:var(--red);letter-spacing:5px;font-weight:600;white-space:nowrap;cursor:pointer}
.lunar-big.sm{font-size:34px;letter-spacing:3px}
.gz-line{font-size:12.5px;color:var(--ink2);margin-top:8px;letter-spacing:.5px}
.gz-line .sep{margin:0 6px;color:var(--ink3)}
.tags{margin-top:7px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:#F1E7D2;color:#8A6B2F}
.tag.red{background:#FBE9E9;color:var(--red)}
.tag.warn{background:rgba(140,22,32,.09);color:#8C1620;border:1px solid rgba(140,22,32,.22)}
.xj-note{margin-top:14px;padding-top:12px;border-top:1px dashed #EFE3CB;font-size:11.5px;line-height:1.7;color:#8A6B2F}

.yiji{margin-top:14px;background:var(--card);border-radius:14px;padding:12px 14px;
  box-shadow:var(--shadow);border:1px solid rgba(192,160,98,.16)}
.yiji-row{display:flex;align-items:flex-start;gap:10px;padding:5px 0}
.mark{flex:0 0 auto;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;font-family:"Songti SC",serif}
.mark.yi{background:var(--red)}
.mark.ji{background:#4A4239}
.mark.both{background:var(--gold)}

.alert{margin-top:10px;background:rgba(179,32,42,.08);border-left:3px solid var(--red);
  color:#8C1620;padding:9px 12px;border-radius:8px;font-size:12.5px;line-height:1.6}
.dateinput{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:inherit;font-size:14px;color:var(--ink);margin-top:8px}
.birth-row{display:flex;gap:8px;margin-top:4px}.bsel{flex:1;min-width:0;padding:10px 6px;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-family:inherit;font-size:15px;color:var(--ink);-webkit-appearance:none;appearance:none;
  text-align:center}
.tag.tap{cursor:pointer}
.tag.tap::after{content:"›";margin-left:3px;opacity:.45;font-size:10px}
.bazi{display:flex;gap:8px;margin-bottom:2px}.bazi>div{flex:1;text-align:center;background:#FFFDF8;border:1px solid var(--line);border-radius:8px;padding:7px 2px}
.bazi>div span{display:block;font-size:10.5px;color:var(--muted);margin-bottom:2px}
.bazi>div b{font-size:19px;letter-spacing:1px;color:var(--ink)}
.favor{margin-top:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wx{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12.5px;font-weight:600;margin-right:2px}
.wx.w0{background:#E8F3E3;color:#3C6B2E}
.wx.w1{background:#FBE9E6;color:#A8342A}
.wx.w2{background:#F3ECDD;color:#8A6B2F}
.wx.w3{background:#EDEDED;color:#5B5B5B}
.wx.w4{background:#E4EDF7;color:#28527A}
.frow{display:flex;gap:8px;margin-top:8px}
.fchip{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:8px;
  background:#fff;font-size:15px;color:var(--ink);cursor:pointer}
.fchip.on{background:var(--red);color:#fff;border-color:var(--red)}
.qitem{border-bottom:1px solid var(--line);padding:9px 0}
.qitem:last-child{border-bottom:0}
.qitem summary{cursor:pointer;font-size:14.5px;color:var(--ink);list-style:none;outline:none}
.qitem summary::-webkit-details-marker{display:none}
.qitem summary::before{content:"›";color:var(--gold);margin-right:6px;display:inline-block;transition:transform .15s}
.qitem[open] summary::before{transform:rotate(90deg)}
.qitem[open] summary{color:var(--red)}
.qitem .quote{margin-top:8px;font-size:13.5px;line-height:1.85;color:#4A4239;letter-spacing:.2px;
  background:rgba(255,255,255,.55);border-radius:8px;padding:10px 12px}
.yiji-txt{font-size:14px;color:var(--ink);letter-spacing:.3px;line-height:1.7}
.yiji-txt span{margin-right:8px;white-space:nowrap}

.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;padding:16px 0 6px}
.gitem{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  padding:6px 0;border-radius:10px;cursor:pointer}
.gitem:active{background:#EFE7D6}
.gicon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:linear-gradient(160deg,#FDF6E8,#F2E5CB);
  border:1px solid rgba(192,160,98,.42);color:var(--red-deep);font-weight:600;padding-bottom:1px}
.gicon.filled{background:linear-gradient(160deg,#C3303A,#8C1620);color:#F7E2C0;border-color:#8C1620}

.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);
  border:1px solid rgba(192,160,98,.16);margin-bottom:12px;overflow:hidden}
.card-hd{display:flex;align-items:center;justify-content:space-between;padding:13px 14px 0}
.card-title{font-size:15px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.card-title::before{content:"";width:3px;height:13px;background:var(--red);border-radius:2px}
.card-more{font-size:12px;color:var(--ink3);cursor:pointer}
.card-body{padding:12px 14px 14px}

.shichen-now{display:flex;align-items:baseline;gap:8px}
.sc-name{font-size:22px;font-family:"Songti SC",serif;color:var(--ink);font-weight:600}
.sc-time{font-size:12px;color:var(--ink3)}
.luck-badge{font-size:11px;padding:1px 8px;border-radius:4px;background:#FBE9E9;color:var(--red);font-weight:600}
.luck-badge.xiong{background:#ECE7DE;color:#5A5148}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tri-cell{text-align:center;padding:9px 4px;border-radius:10px;background:#F8F3E7;border:1px solid rgba(192,160,98,.14)}
.tri-v{font-size:16px;font-family:"Songti SC",serif;color:var(--ink);font-weight:600;line-height:1.3}
.tri-v.good{color:var(--red)}
.tri-l{font-size:11px;color:var(--ink3);margin-top:3px}
.pos-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;text-align:center}
.pos-v{font-size:14px;color:var(--ink);font-family:"Songti SC",serif}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;padding:4px 10px;border-radius:7px;background:#F6F0E2;color:var(--ink2);
  border:1px solid rgba(192,160,98,.14);cursor:pointer}
.chip:active{background:#EFE7D6}
.chip.red{background:#FBE9E9;color:var(--red);border-color:rgba(179,32,42,.16)}

.tabs{display:flex;gap:22px;padding:0 14px;border-bottom:1px solid var(--line);margin-top:10px}
.tab{padding:8px 0 9px;font-size:14px;color:var(--ink3);position:relative;cursor:pointer}
.tab.on{color:var(--red);font-weight:600}
.tab.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-1px;width:18px;height:2.5px;border-radius:2px;background:var(--red)}

.ts-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #F0E8D8;font-size:13px}
.ts-row:last-child{border-bottom:none}
.ts-gz{width:52px;font-family:"Songti SC",serif;color:var(--ink);font-weight:600}
.ts-time{width:92px;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.ts-luck{width:26px;text-align:center;font-size:12px;font-weight:600}
.ts-luck.j{color:var(--red)}
.ts-luck.x{color:#8A8175}
.ts-yi{flex:1;color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.dress-head{display:flex;align-items:center;justify-content:space-between}
.dress-name{font-size:19px;font-family:"Songti SC",serif;color:var(--red);font-weight:600}
.dress-swatches{display:flex;gap:8px;margin-top:10px}
.sw-wrap{flex:1;text-align:center}
.sw{height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.04)}
.sw-wrap span{display:block;font-size:10.5px;color:var(--ink3);margin-top:4px}
.dress-txt{font-size:12.5px;color:var(--ink2);margin-top:10px;line-height:1.75}
.dress-sub{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--ink3)}
.dress-sub b{color:var(--ink);font-weight:600}

.btn{display:block;width:100%;padding:11px;border-radius:10px;border:none;font-size:14px;
  background:linear-gradient(160deg,#C3303A,#8C1620);color:#FFF6E4;font-weight:600;letter-spacing:1px;
  cursor:pointer;margin-top:12px}
.btn:active{opacity:.88}
.btn.ghost{background:transparent;border:1px solid var(--red);color:var(--red)}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;
  background:rgba(255,253,248,.96);border-top:1px solid var(--line);z-index:40;
  backdrop-filter:blur(10px);padding-bottom:env(safe-area-inset-bottom)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:13.5px;letter-spacing:1px;color:var(--ink3);cursor:pointer}
.tb.on{color:var(--red);font-weight:600}
.tb i{font-style:normal;font-size:16px;line-height:1;letter-spacing:1px}

.mask{position:absolute;inset:0;background:rgba(30,24,18,.42);z-index:60;display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;
  padding:16px 14px 22px;z-index:70;transform:translateY(100%);transition:transform .26s ease;
  max-height:78%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:10px}
.week-hd{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--ink3);text-align:center;padding-bottom:6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cell{height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;line-height:1.15}
.cell .lu{font-size:9.5px;color:var(--ink3);transform:scale(.92)}
.cell.today{background:#FBE9E9;color:var(--red);font-weight:600}
.cell.sel{background:var(--red);color:#fff}
.cell.sel .lu{color:rgba(255,255,255,.8)}
.cell.empty{visibility:hidden}

.thing-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thing{font-size:13px;padding:6px 13px;border-radius:8px;background:#F6F0E2;color:var(--ink2);cursor:pointer}
.thing.on{background:var(--red);color:#fff}
.day-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed #F0E8D8;cursor:pointer}
.day-row:last-child{border:none}
.day-d{width:56px;text-align:center;flex:0 0 auto}
.day-d b{font-size:19px;font-family:"Songti SC",serif;color:var(--red);font-weight:600}
.day-d span{display:block;font-size:10px;color:var(--ink3)}
.day-info{flex:1;font-size:13px}
.day-info b{font-weight:600}
.day-info p{margin:2px 0 0;font-size:11.5px;color:var(--ink3)}
.empty-tip{text-align:center;color:var(--ink3);font-size:13px;padding:32px 0}
.note{font-size:11.5px;color:var(--ink3);line-height:1.7;padding:2px 4px 8px}
.hr{height:1px;background:var(--line);margin:12px 0}
.quote{font-size:12.5px;color:var(--ink2);line-height:1.8;padding:8px 10px;background:#FAF5E9;border-left:2px solid var(--gold);margin:6px 0}
.mini{font-size:11px;color:var(--ink3)}
.st{font-size:11.5px;color:var(--ink2);padding:2px 0}
.st b{color:#2F6B4F}

/* 五行男女 · 合婚 */
.warnbox{margin:2px 0 10px;padding:10px 12px;background:#FBF3E4;border:1px solid #E4D2AE;
  border-left:3px solid var(--gold);border-radius:8px;font-size:12px;line-height:1.7;color:#6B5A3E}
.warnbox b{color:#8C1620}
.cp-block{margin-top:10px}
.cp-lab{font-size:12.5px;color:var(--ink2);margin-bottom:4px}
.hh-score{text-align:center;padding:12px 0 6px}
.hh-num{font-size:52px;line-height:1;color:var(--red);font-weight:600}
.hh-grade{font-size:15px;color:var(--ink);margin-top:4px;letter-spacing:2px}
.hh-cols{display:flex;gap:10px;margin:10px 0 12px}
.hh-col{flex:1;background:#FAF5E9;border-radius:8px;padding:8px 10px;text-align:center}
.hh-bz{font-size:15px;margin:4px 0 2px;letter-spacing:1px}
.hh-item{display:flex;flex-wrap:wrap;align-items:baseline;padding:8px 0;border-bottom:1px dotted var(--line)}
.hh-item:last-child{border-bottom:0}
.hh-mk{width:18px;font-size:13px}
.hh-item.ok .hh-mk{color:#2F6B4F}
.hh-item.bad .hh-mk{color:var(--red)}
.hh-item.flat .hh-mk{color:var(--ink3)}
.hh-t{font-size:13.5px;color:var(--ink);font-weight:600;flex:1}
.hh-d{font-size:12.5px;color:var(--ink3)}
.hh-note{flex-basis:100%;font-size:11.5px;color:var(--ink3);margin:2px 0 0 18px}

.relwarn{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;background:rgba(179,32,42,.10);color:#8C1620;font-size:11px;font-weight:400}

/* 首页模式条 */
.modebar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 2px 2px}
.modebar::-webkit-scrollbar{display:none}
.mbtn{flex:0 0 auto;padding:5px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink2);font-size:12.5px}
.mbtn.on{background:var(--red);border-color:var(--red);color:#fff}
.mbtn.act{color:var(--red);border-color:#E7C6C8}

.bsel.need{border-color:var(--red);box-shadow:0 0 0 2px rgba(179,32,42,.12)}
.bsel[disabled]{opacity:.55}

/* 开发者说明 */
.dev-h{font-weight:600;color:#8C1620;margin:14px 0 4px;font-size:14px}
.dev-h:first-child{margin-top:2px}
.qr-wrap{display:flex;gap:14px;align-items:center;margin-top:6px}
.qr{width:112px;height:112px;border-radius:10px;border:1px solid var(--line);object-fit:cover;background:#fff}
.qr-empty{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--ink3);border-style:dashed}
.qr-txt{flex:1;font-size:13px;color:var(--ink2);line-height:1.7}

</style>

<script>
/* =====================================================================
   协纪黄历引擎 —— 历法 + 建除 + 神煞 + 宜忌
   规则底本：《钦定协纪辨方书》卷十「宜忌」（四库全书本）
   历法口径：北京时间 UTC+8；定朔定气；年柱以立春、月柱以节为界
   ===================================================================== */
(function (root, factory) {
  if (typeof module !== 'undefined' && module.exports) module.exports = factory();
  else root.XiejiEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const RAD = Math.PI / 180;

  /* ---------------------------------------------------------------- 儒略日 */
  function gregorianToJDN(y, m, d) {
    const a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
    return d + Math.floor((153 * mm + 2) / 5) + 365 * yy +
      Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
  }
  function jdnToGregorian(jdn) {
    const a = jdn + 32044;
    const b = Math.floor((4 * a + 3) / 146097);
    const c = a - Math.floor(146097 * b / 4);
    const d = Math.floor((4 * c + 3) / 1461);
    const e = c - Math.floor(1461 * d / 4);
    const m = Math.floor((5 * e + 2) / 153);
    return {
      year: 100 * b + d - 4800 + Math.floor(m / 10),
      month: m + 3 - 12 * Math.floor(m / 10),
      day: e - Math.floor((153 * m + 2) / 5) + 1
    };
  }
  // JDN + 0.5 == 当日 00:00 UT 的儒略日
  function dateToJD(y, m, d, hour) {
    return gregorianToJDN(y, m, d) - 0.5 + (hour || 0) / 24;
  }

  /* ------------------------------------------------------------- ΔT (TT-UT) */
  function deltaT(year) {
    let t, u;
    if (year < 1900) { u = (year - 1820) / 100; return -20 + 32 * u * u; }
    if (year < 1920) { t = year - 1900; return -2.79 + 1.494119 * t - 0.0598939 * t * t + 0.0061966 * t ** 3 - 0.000197 * t ** 4; }
    if (year < 1941) { t = year - 1920; return 21.20 + 0.84493 * t - 0.076100 * t * t + 0.0020936 * t ** 3; }
    if (year < 1961) { t = year - 1950; return 29.07 + 0.407 * t - t * t / 233 + t ** 3 / 2547; }
    if (year < 1986) { t = year - 1975; return 45.45 + 1.067 * t - t * t / 260 - t ** 3 / 718; }
    if (year < 2005) { t = year - 2000; return 63.86 + 0.3345 * t - 0.060374 * t * t + 0.0017275 * t ** 3 + 0.000651814 * t ** 4 + 0.00002373599 * t ** 5; }
    if (year < 2050) { t = year - 2000; return 62.92 + 0.32217 * t + 0.005589 * t * t; }
    u = (year - 1820) / 100;
    return -20 + 32 * u * u - 0.5628 * (2150 - year);
  }

  /* --------------------------------------------------------- 太阳视黄经(度) */
  function sunLongitude(jdTT) {
    const T = (jdTT - 2451545.0) / 36525;
    const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
    const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * RAD)
      + (0.019993 - 0.000101 * T) * Math.sin(2 * M * RAD)
      + 0.000289 * Math.sin(3 * M * RAD);
    const omega = 125.04 - 1934.136 * T;
    let lam = L0 + C - 0.00569 - 0.00478 * Math.sin(omega * RAD);
    return ((lam % 360) + 360) % 360;
  }

  /* 时区：1929 年前时宪历用北京地方平太阳时（约 UTC+7:45:40），其后用东八区 */
  function tzOffsetHours(year) {
    return year < 1929 ? (7 + 45 / 60 + 40 / 3600) : 8;
  }

  const TERM_NAMES = ['立春', '雨水', '惊蛰', '春分', '清明', '谷雨', '立夏', '小满', '芒种', '夏至',
    '小暑', '大暑', '立秋', '处暑', '白露', '秋分', '寒露', '霜降', '立冬', '小雪', '大雪', '冬至', '小寒', '大寒'];
  // 立春 = 315°，每隔 15° 一个节气
  const TERM_LON = TERM_NAMES.map((_, i) => (315 + 15 * i) % 360);

  // 返回某年某节气的 JDN（北京时间所在民用日）
  const termCache = new Map();
  function solarTermJDN(year, idx) {
    const key = year * 100 + idx;
    if (termCache.has(key)) return termCache.get(key);
    const target = TERM_LON[idx];
    // 粗估：立春 ≈ 2月4日，每节气约 15.22 天
    let jd = gregorianToJDN(year, 2, 4) + 0.5 + idx * 15.2184;
    for (let i = 0; i < 10; i++) {
      const lon = sunLongitude(jd);
      let diff = target - lon;
      diff = ((diff + 180) % 360 + 360) % 360 - 180;
      if (Math.abs(diff) < 1e-7) break;
      jd += diff / 0.9856473;
    }
    const g = jdnToGregorian(Math.floor(jd));
    const jdUT = jd - deltaT(g.year) / 86400;
    const jdn = Math.floor(jdUT + tzOffsetHours(g.year) / 24 + 0.5);
    termCache.set(key, jdn);
    return jdn;
  }

  /* 节气瞬时（北京时间）：返回 { jdn: 所在民用日, mins: 当日 0 时起的分钟数 } */
  const termInstCache = new Map();
  function solarTermInstant(year, idx) {
    const key = year * 100 + idx;
    if (termInstCache.has(key)) return termInstCache.get(key);
    const target = TERM_LON[idx];
    let jd = gregorianToJDN(year, 2, 4) + 0.5 + idx * 15.2184;
    for (let i = 0; i < 60; i++) {
      const lon = sunLongitude(jd);
      let diff = target - lon;
      diff = ((diff + 180) % 360 + 360) % 360 - 180;
      if (Math.abs(diff) < 1e-9) break;
      jd += diff / 0.9856473;
    }
    const g = jdnToGregorian(Math.floor(jd));
    const jdUT = jd - deltaT(g.year) / 86400;
    const bj = jdUT + tzOffsetHours(g.year) / 24 + 0.5;
    const day = Math.floor(bj);
    const out = { jdn: day, mins: Math.round((bj - day) * 1440) };
    termInstCache.set(key, out);
    return out;
  }

  /* 出生日 + 时辰，是否落在交节（十二节）的同一个时辰内
     返回 { name, jdn, mins } 或 null */
  function termInHour(birthJDN, hourZhi) {
    if (hourZhi === null || hourZhi === undefined) return null;
    const g = jdnToGregorian(birthJDN);
    const startH = hourZhi === 0 ? 23 : 2 * hourZhi - 1;
    const from = startH * 60, to = from + 120;
    for (let yy = g.year - 1; yy <= g.year + 1; yy++) {
      for (let i = 0; i < 24; i += 2) {          // 只查十二节（换柱之用）
        const t = solarTermInstant(yy, i);
        if (t.jdn !== birthJDN) continue;
        if (t.mins >= from && t.mins < to) {
          return { name: TERM_NAMES[i], jdn: t.jdn, mins: t.mins, hourZhi: hourZhi };
        }
      }
    }
    return null;
  }

  // 节气标签 (year, i)：i=0 立春（该年 2 月）… i=23 大寒（次年 1 月）
  function termIndexOfJDN(jdn) {
    const { year } = jdnToGregorian(jdn);
    let best = -1, bestJdn = -Infinity;
    for (let yy = year - 1; yy <= year + 1; yy++) {
      for (let i = 0; i < 24; i++) {
        const t = solarTermJDN(yy, i);
        if (t <= jdn && t > bestJdn) { bestJdn = t; best = i; }
      }
    }
    return best;
  }
  function termInfo(jdn) {
    const { year } = jdnToGregorian(jdn);
    let prev = null, next = null;
    for (let yy = year - 1; yy <= year + 1; yy++) {
      for (let i = 0; i < 24; i++) {
        const t = solarTermJDN(yy, i);
        if (t <= jdn && (!prev || t > prev.jdn)) prev = { jdn: t, idx: i, name: TERM_NAMES[i] };
        if (t > jdn && (!next || t < next.jdn)) next = { jdn: t, idx: i, name: TERM_NAMES[i] };
      }
    }
    return { idx: prev.idx, name: prev.name, jdn: prev.jdn, nextJdn: next.jdn, nextName: next.name, nextIdx: next.idx };
  }

  /* --------------------------------------------------------- 朔望 */
  function newMoonJDE(k) {
    const T = k / 1236.85;
    const JDE = 2451550.09766 + 29.530588861 * k + 0.00015437 * T * T
      - 0.000000150 * T ** 3 + 0.00000000073 * T ** 4;
    const E = 1 - 0.002516 * T - 0.0000074 * T * T;
    const M = (2.5534 + 29.10535670 * k - 0.0000014 * T * T - 0.00000011 * T ** 3) * RAD;
    const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T * T + 0.00001238 * T ** 3 - 0.000000058 * T ** 4) * RAD;
    const F = (160.7108 + 390.67050284 * k - 0.0016118 * T * T - 0.00000227 * T ** 3 + 0.000000011 * T ** 4) * RAD;
    const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T * T + 0.00000215 * T ** 3) * RAD;
    let c = -0.40720 * Math.sin(Mp)
      + 0.17241 * E * Math.sin(M)
      + 0.01608 * Math.sin(2 * Mp)
      + 0.01039 * Math.sin(2 * F)
      + 0.00739 * E * Math.sin(Mp - M)
      - 0.00514 * E * Math.sin(Mp + M)
      + 0.00208 * E * E * Math.sin(2 * M)
      - 0.00111 * Math.sin(Mp - 2 * F)
      - 0.00057 * Math.sin(Mp + 2 * F)
      + 0.00056 * E * Math.sin(2 * Mp + M)
      - 0.00042 * Math.sin(3 * Mp)
      + 0.00042 * E * Math.sin(M + 2 * F)
      + 0.00038 * E * Math.sin(M - 2 * F)
      - 0.00024 * E * Math.sin(2 * Mp - M)
      - 0.00017 * Math.sin(Om)
      - 0.00007 * Math.sin(Mp + 2 * M)
      + 0.00004 * Math.sin(2 * Mp - 2 * F)
      + 0.00004 * Math.sin(3 * M)
      + 0.00003 * Math.sin(Mp + M - 2 * F)
      + 0.00003 * Math.sin(2 * Mp + 2 * F)
      - 0.00003 * Math.sin(Mp + M + 2 * F)
      + 0.00003 * Math.sin(Mp - M + 2 * F)
      - 0.00002 * Math.sin(Mp - M - 2 * F)
      - 0.00002 * Math.sin(3 * Mp + M)
      + 0.00002 * Math.sin(4 * Mp);
    return JDE + c;
  }
  const nmCache = new Map();
  function newMoonJDN(k) {
    if (nmCache.has(k)) return nmCache.get(k);
    const jde = newMoonJDE(k);
    const { year } = jdnToGregorian(Math.floor(jde + 0.5));
    const jdUT = jde - deltaT(year) / 86400;
    const jdn = Math.floor(jdUT + tzOffsetHours(year) / 24 + 0.5);
    nmCache.set(k, jdn);
    return jdn;
  }
  function newMoonIndexNear(jdn) {
    let k = Math.round((jdn - 2451550.1) / 29.530588861);
    let guard = 0;
    while (newMoonJDN(k) > jdn && guard++ < 10) k--;
    guard = 0;
    while (newMoonJDN(k + 1) <= jdn && guard++ < 10) k++;
    return k;
  }

  /* --------------------------------------------------------- 农历 */
  // 一"岁"：从含冬至之月（十一月）到下一个冬至月之前的各月
  function suiMonths(suiYear) {
    // suiYear: 该岁的冬至所在的公历年（即 Y-1 的冬至）
    const dz = solarTermJDN(suiYear, 21);     // 冬至
    const k11 = newMoonIndexNear(dz);
    const dzNext = solarTermJDN(suiYear + 1, 21);
    const k11b = newMoonIndexNear(dzNext);
    const n = k11b - k11;
    const months = [];
    for (let i = 0; i < n; i++) {
      const start = newMoonJDN(k11 + i);
      const end = newMoonJDN(k11 + i + 1);
      months.push({ start, end, k: k11 + i, zhongqi: hasZhongqi(start, end) });
    }
    // 编月序：11 月起
    let leapIdx = -1;
    if (n === 13) {
      for (let i = 1; i < n; i++) { if (!months[i].zhongqi) { leapIdx = i; break; } }
    }
    let num = 11, prevNum = 11;
    for (let i = 0; i < n; i++) {
      if (i === 0) { months[i].month = 11; months[i].leap = false; }
      else if (i === leapIdx) { months[i].month = prevNum; months[i].leap = true; }
      else {
        num = num % 12 + 1;
        months[i].month = num; months[i].leap = false;
      }
      if (!months[i].leap) prevNum = months[i].month;
    }
    return months;
  }
  function hasZhongqi(startJDN, endJDN) {
    // 月初 00:00 与月末 00:00 的太阳视黄经
    const l1 = sunLongitude(dateToJDJDN(startJDN));
    const l2 = sunLongitude(dateToJDJDN(endJDN));
    const a = l1, b = l2 < l1 ? l2 + 360 : l2;
    for (let m = 0; m < 360; m += 30) {
      let x = m;
      while (x < a) x += 360;
      if (x < b) return true;
    }
    return false;
  }
  function dateToJDJDN(jdn) { // 该日 00:00 北京时的 TT 儒略日（近似）
    const g = jdnToGregorian(jdn);
    return dateToJD(g.year, g.month, g.day, -8) + deltaT(g.year) / 86400;
  }

  const lunarYearCache = new Map();
  function lunarYear(Y) {
    if (lunarYearCache.has(Y)) return lunarYearCache.get(Y);
    const m1 = suiMonths(Y - 1);   // 十一月(Y-1)、十二月、正月(Y) …
    const m2 = suiMonths(Y);       // 十一月(Y)、十二月 …
    const idx1 = m1.findIndex(x => x.month === 1 && !x.leap);
    const idx2 = m2.findIndex(x => x.month === 1 && !x.leap);
    if (idx1 < 0 || idx2 < 0) return null;
    const start = m1[idx1].start;
    const next = m2[idx2].start;
    const months = m1.slice(idx1).concat(m2.slice(0, idx2)); // 正月 … 十二月
    const info = { Y, start, next, months };
    lunarYearCache.set(Y, info);
    return info;
  }

  function toLunar(jdn) {
    let Y = jdnToGregorian(jdn).year;
    let info = lunarYear(Y);
    if (jdn < info.start) { Y -= 1; info = lunarYear(Y); }
    if (jdn >= info.next) { Y += 1; info = lunarYear(Y); }
    for (const m of info.months) {
      if (jdn >= m.start && jdn < m.end) {
        return { year: Y, month: m.month, leap: !!m.leap, day: jdn - m.start + 1, monthStart: m.start };
      }
    }
    return null;
  }

  /* --------------------------------------------------------- 干支 */
  const GAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
  const ZHI = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
  const ANIMALS = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];

  function gz(idx) { return GAN[((idx % 10) + 10) % 10] + ZHI[((idx % 12) + 12) % 12]; }
  function gzIndex(g, z) { // 求 0..59
    const gi = GAN.indexOf(g), zi = ZHI.indexOf(z);
    for (let i = 0; i < 60; i++) if (i % 10 === gi && i % 12 === zi) return i;
    return 0;
  }
  function dayGZ(jdn) { return (jdn + 49) % 60; } // 1900-01-01 = 甲戌

  function yearGZ(jdn) {
    const g = jdnToGregorian(jdn);

    return (y - 4) % 60;

  function monthBranchIndex(jdn) {

    const jieIdx = Math.floor(t.idx / 2); // 0=立春
    return (2 + jieIdx) % 12;
  }
  function monthGZ(jdn) {
    const yGZ = yearGZ(jdn);
    const ys = yGZ % 10;
    const br = monthBranchIndex(jdn);
    const mIdx = ((br - 2) + 12) % 12;
    const stem = ((ys % 5) * 2 + 2 + mIdx) % 10;
    return { index: (() => { for (let i = 0; i < 60; i++) if (i % 10 === stem && i % 12 === br) return i; })(), stem, branch: br };
  }

    if (jcName === '执日' || jcName === '收日' || jcName === '危日') {
      if (hunt) out.push('畋猎');
      if (fish) out.push('取鱼');

    return out;
  }

  /* --------------------------------------------------------- 卷十「月表」六等
     数据来源：《钦定协纪辨方书》卷十 月表（原书第 220–221 页），

  const YUEBIAO = {

  /* 取当日等第：表中诸煞取最重者；月破固定最下（卷十「破日…诸事不宜」）
     若当日不属月表任一日类，则「无等第」——不判吉凶，不以默认上等冒充大吉 */
  function gradeOf(ss, monthZhi) {
    if (ss.some(s => s.name === '月破')) return { g: 5, from: '月破' };
    let g = -1, from = null;
    for (const s of ss) {
      const col = YUEBIAO[s.name];
      if (!col) continue;
      for (let gi = 0; gi < 6; gi++) {
        if (col[gi].indexOf(monthZhi) >= 0 && gi > g) { g = gi; from = s.name; }
      }
    }
    if (ss.some(s => s.name === '月建') && g < 2) { g = 2; from = '月建'; }
    return { g, from };
  }

  /* 六等的行为：按卷十判词
     上  从宜不从忌
     上次 遇德从宜不从忌；不遇从宜亦从忌
     中  遇德从宜不从忌；不遇从忌不从宜
     中次 遇德从宜亦从忌；不遇从忌不从宜
     下  遇德从忌不从宜；不遇诸事皆忌
     下下 遇德亦诸事皆忌 */
  function policyOf(g, hasDe) {
    if (g < 0) return 'both';          // 无等第：吉神列宜、凶煞列忌，相抵者只列忌
    if (g === 0) return 'yi';
    if (g === 1) return hasDe ? 'yi' : 'both';
    if (g === 2) return hasDe ? 'yi' : 'ji';
    if (g === 3) return hasDe ? 'both' : 'ji';
    if (g === 4) return hasDe ? 'ji' : 'none';
    return 'none';
  }

  /* --------------------------------------------------------- 主计算 */
  function computeDay(y, m, d) {
    const jdn = gregorianToJDN(y, m, d);
    const lunar = toLunar(jdn);
    const dgz = dayGZ(jdn);
    const dayGan = dgz % 10, dayZhi = dgz % 12;
    const ygz = yearGZ(jdn);
    const mgz = monthGZ(jdn);
    const monthZhi = mgz.branch;
    const jc = jianchuIndex(dayZhi, monthZhi);
    const t = termInfo(jdn);
    const ctx = { dayGan, dayZhi, monthZhi, monthGan: mgz.stem, jianchu: jc };

    const ss = shensha(jdn, ctx);
    const seaAdd = seasonalAdds(JIANCHU[jc] + '日', jdn);

    /* 合并宜忌 —— 依卷十「铺注条例」：凶煞所忌为硬约束，吉神宜项遇忌即去；
       大凶临日而无德神相解者（协纪谓"吉神失力"），只列该煞"止不忌"之事 */
    const yiSet = new Set(), jiSet = new Set(), src = new Map();
    const push = (set, token, from) => {
      set.add(token);
      if (!src.has(token)) src.set(token, []);
      const arr = src.get(token);
      if (!arr.includes(from)) arr.push(from);
    };

    const heavy = ss.filter(s => HEAVY.includes(s.name));
    const hasDe = ss.some(s => DE_SHEN.includes(s.name));
    const hardPo = ss.some(s => s.name === '月破' || s.name === '月厌');
    const shanSha = ss.filter(s => ['劫煞', '灾煞', '月煞', '月刑', '月害'].includes(s.name));
    const jianDay = ss.some(s => s.name === '月建');

    /* 等第（月表） */
    const gr = gradeOf(ss, monthZhi);
    const policy = policyOf(gr.g, hasDe);

    /* 卷十明文的两条"遇德减忌"：
       三煞／月刑「與天德月德天德合月德合併，止忌安撫邊境、選將、訓兵、出師、求醫療病，餘皆不忌」
       月建「與天德月德天德合月德合天赦月恩四相併，止忌營建宫室…破土，餘皆不忌」 */
    const DE_SHA_JI = ['安抚边境', '选将', '训兵', '出师', '求医'];
    /* 卷十明文：三煞／月刑「與天德月德…併，止忌安撫邊境、選將、訓兵、出師、求醫療病，餘皆不忌」
       劫煞另有一条：「寅申月又值六合，止忌（同上五項），餘皆不忌」——故六合亦触发减忌 */
    const hasLiuhe = ss.some(s => s.name === '六合');
    const hasJiesha = ss.some(s => s.name === '劫煞');
    /* 月恩、四相只在「月建」条与德神并列（卷十原文），不入三煞减忌，也不改判词「遇德」 */
    const hasYueEn = ss.some(s => s.name === '月恩');
    const hasSiXiang = ss.some(s => s.name === '四相');
    const deSha = (hasDe || (hasLiuhe && hasJiesha)) && shanSha.length > 0 && !hardPo && !jianDay;
    const deJian = (hasDe || hasYueEn || hasSiXiang) && jianDay && !hardPo;

    for (const s of ss) for (const x of s.ji) push(jiSet, x, s.name);
    if (policy !== 'none') {
      for (const s of ss) for (const x of s.yi) push(yiSet, x, s.name);
      for (const x of seaAdd) push(yiSet, x, JIANCHU[jc] + '日（时令）');
    }
    /* 卷十「止不忌」：义为不注宜、亦不注忌——故从忌中剔出，绝不入宜集 */
    for (const s of ss) if (s.bai) for (const x of s.bai) jiSet.delete(x);
    if (jc === 6) for (const x of PO_YI) push(yiSet, x, '破日专宜');

    /* 彭祖百忌：后世通书俗忌，不属《协纪》月表体系，故不入宜忌，只单列备参 */
    const baiji = [];
    (BAIJI_GAN[dayGan] || []).forEach(x => { if (baiji.indexOf(x) < 0) baiji.push(x); });
    (BAIJI_ZHI[dayZhi] || []).forEach(x => { if (baiji.indexOf(x) < 0) baiji.push(x); });

    /* 遇德减忌：只保留卷十点名的几项 */
    if (deSha) {
      const keep = new Set(DE_SHA_JI);
      for (const t of Array.from(jiSet)) if (!keep.has(t)) jiSet.delete(t);
    } else if (deJian) {
      const keep = new Set(TUFU_JI);
      for (const t of Array.from(jiSet)) if (!keep.has(t)) jiSet.delete(t);
    }

    /* 百忌日既不属协纪，也从宜集剔除，避免与止不忌相抵 */
    for (const t of baiji) yiSet.delete(t);

    /* 依等第处理宜忌相抵 */
    const conflicts = [];
    if (policy === 'yi') {
      for (const t of Array.from(jiSet)) if (yiSet.has(t) && baiji.indexOf(t) < 0) jiSet.delete(t);
    } else if (policy === 'both') {
      for (const t of yiSet) if (jiSet.has(t)) conflicts.push(t);
    } else {
      for (const t of Array.from(yiSet)) if (jiSet.has(t)) { yiSet.delete(t); conflicts.push(t); }
    }

    /* 卷十「止忌」的几项是硬忌，虽遇德、虽"从宜"也不得改为宜 */
    if (deSha) {
      for (const t of DE_SHA_JI) { jiSet.add(t); yiSet.delete(t); }
    } else if (deJian) {
      for (const t of TUFU_JI) { jiSet.add(t); yiSet.delete(t); }
    }

    const byOrder = (a, b) => (ORDER_IDX.has(a) ? ORDER_IDX.get(a) : 999) - (ORDER_IDX.has(b) ? ORDER_IDX.get(b) : 999);
    const yi = Array.from(yiSet).sort(byOrder);
    const ji = Array.from(jiSet).sort(byOrder);

    /* 层级（由等第决定；无等第者不判吉凶） */
    const noGrade = gr.g < 0;
    const level = noGrade ? 0 : GRADE_LEVEL_N[gr.g];
    const levelText = noGrade ? '不判' : GRADE_LEVEL[gr.g];
    const gradeName = noGrade ? '无等第' : GRADE_NAME[gr.g];

    /* 按类归并（忌项多时便于阅读） */
    const groupByCat = tokens => {
      const used = new Set();
      const out = CATS.map(([name, list]) => {
        const hit = tokens.filter(t => list.includes(t));
        hit.forEach(t => used.add(t));
        return { name, items: hit };
      }).filter(g => g.items.length);
      const rest = tokens.filter(t => !used.has(t));
      if (rest.length) out.push({ name: '其他', items: rest });
      return out;
    };

    /* 时辰：值神（黄黑道）＋冲煞＋时家吉神＋时之宜忌 */
    const kong = xunKong(dgz);
    const dayYiSet = new Set(yi), dayJiSet = new Set(ji);
    const hours = [];
    for (let b = 0; b < 12; b++) {
      const stem = ((dayGan % 5) * 2 + b) % 10;
      const shenIdx = ((b - (2 * dayZhi + 8)) % 12 + 12) % 12;
      const shen = HUANGDAO[shenIdx];
      const godGood = !!IS_GOOD[shenIdx];
      const chongZhi = (b + 6) % 12;
      const sha = SHA_DIR[sanheGroup(b)];
      const isChongDay = b === (dayZhi + 6) % 12;      // 时冲日支：日破时
      const isKong = kong[0] === b || kong[1] === b;   // 旬空
      const lu = LU[dayGan] === b;                     // 日禄时
      const guiren = (GUIREN[dayGan] || []).indexOf(b) >= 0;
      const yima = YIMA[sanheGroup(dayZhi)] === b;     // 驿马时
      const liuhe = heZhi(dayZhi) === b;               // 时合日支

      /* 时冲日支＝日破时：不改写黄黑道吉凶（保持与通书对照一致），只清空宜、全忌、加注 */
      const bigBad = false;
      const good = godGood ? '吉' : '凶';

      let hy = [];
      if (!isChongDay) {
        hy = godGood ? yi.slice() : yi.filter(t => SMALL.includes(t));
        if (lu) hy = hy.concat(['纳财', '上官']);
        if (guiren) hy = hy.concat(['上官', '临政']);
        if (yima) hy = hy.concat(['行幸', '般移']);
        if (liuhe) hy = hy.concat(['宴会', '结姻']);
        hy = Array.from(new Set(hy)).filter(t => !dayJiSet.has(t)).sort(byOrder);
      }

      let hj = [];
      if (isChongDay) hj = ji.slice();
      else {
        if (isKong) hj = hj.concat(['纳财', '上官', '行幸']);
        if (!godGood) hj = hj.concat(['嫁娶', '开市', '出行', '上官', '兴造', '安葬']);
        hj = Array.from(new Set(hj)).filter(t => !hy.includes(t)).sort(byOrder);
      }

      const note = isChongDay ? '时冲日支，为日破时，诸事不宜，大事另择'
        : (isKong ? '旬空之时，宜缓不宜急，大事另择'
          : (godGood ? '黄道时，可行本日所宜之事' : '黑道时，只取本日所宜中的小事，大事另择'));

      const marks = [];
      if (lu) marks.push('日禄');
      if (guiren) marks.push('天乙贵人');
      if (yima) marks.push('驿马');
      if (liuhe) marks.push('六合');
      if (isKong) marks.push('旬空');
      if (isChongDay) marks.push('时破日');

      hours.push({
        branch: b, stem, gz: GAN[stem] + ZHI[b], zhiName: ZHI[b], range: HOUR_RANGE[b],
        shen, godGood, good, chongZhi, chongName: ANIMALS[chongZhi], sha,
        marks, yi: hy, ji: hj, isChongDay, isKong, note
      });
    }

    const shaDay = SHA_DIR[sanheGroup(dayZhi)];
    const chongDay = (dayZhi + 6) % 12;

    return {
      solar: { y, m, d }, jdn,
      week: ['日', '一', '二', '三', '四', '五', '六'][(jdn + 1) % 7],
      lunar, dayGZ: dgz, dayGan, dayZhi, yearGZ: ygz, monthGZ: mgz,
      yearGZText: gz(ygz), monthGZText: gz(mgz.index), dayGZText: gz(dgz),
      animal: ANIMALS[ygz % 12],
      term: t, jianchu: jc, jianchuName: JIANCHU[jc] + '日',
      shensha: ss, yi, ji, src: Object.fromEntries(src), conflicts, baiji, hours,
      level, levelText, gradeName, gradeFrom: gr.from, policy,
      suppress: policy === 'none', hasDe, heavy: heavy.map(s => s.name),
      yiGroups: groupByCat(yi), jiGroups: groupByCat(ji),
      chong: { zhi: chongDay, name: ANIMALS[chongDay], sha: shaDay },
      rules: {
        monthZhi: ZHI[monthZhi], jianchu: JIANCHU[jc],
        isPo: dayZhi === (monthZhi + 6) % 12
      }
    };
  }

  /* 农历 → 儒略日（逐日扫描该农历年，闰月以 leap 区分） */
  function lunarToJDN(y, m, d, leap) {
    const start = gregorianToJDN(y, 1, 10);
    const limit = start + 430;
    for (let jdn = start; jdn < limit; jdn++) {
      const L = toLunar(jdn);
      if (L.year === y && L.month === m && L.day === d && !!L.leap === !!leap) return jdn;
    }
    return null;
  }
  /* 某农历年的月份表：[{month, leap, days}] */
  function lunarMonthsOf(y) {
    const start = lunarToJDN(y, 1, 1, false);
    if (start === null) return [];
    const out = [];
    let cur = null;
    for (let jdn = start; jdn < start + 400; jdn++) {
      const L = toLunar(jdn);
      if (L.year !== y) { if (cur) cur.days = jdn - cur.start; break; }
      if (!cur || cur.start !== L.monthStart) {
        if (cur) cur.days = L.monthStart - cur.start;
        cur = { month: L.month, leap: L.leap, start: L.monthStart, days: 0 };
        out.push(cur);
      }
    }
    return out;
  }

  /* ---------------- 八字：四柱、十神、刑冲合害 ---------------- */
  const GAN_WX = g => Math.floor(g / 2) % 5;          // 0木1火2土3金4水
  const SHENG = i => (i + 1) % 5;                      // 我生
  const KE = i => (i + 2) % 5;                         // 我克

  function shiShen(meGan, otherGan) {
    const me = GAN_WX(meGan), ot = GAN_WX(otherGan);
    const sameYin = (meGan % 2) === (otherGan % 2);
    if (me === ot) return sameYin ? '比肩' : '劫财';
    if (ot === SHENG(me)) return sameYin ? '食神' : '伤官';
    if (ot === KE(me)) return sameYin ? '偏财' : '正财';
    if (me === KE(ot)) return sameYin ? '七杀' : '正官';
    return sameYin ? '偏印' : '正印';
  }

  /* 五鼠遁：日干定子时天干 */
  function hourGan(dayGan, hourZhi) { return ((dayGan % 5) * 2 + hourZhi) % 10; }

  function baziOf(y, m, d, hourZhi) {
    const r = computeDay(y, m, d);
    const hz = (hourZhi === undefined || hourZhi === null) ? null : hourZhi;
    const yg = r.yearGZ % 10, dg = r.dayGZ % 10;
    const mg = (r.monthGZ && typeof r.monthGZ === 'object')
      ? { g: r.monthGZ.stem, z: r.monthGZ.branch, idx: r.monthGZ.index }
      : { g: r.monthGZ % 10, z: r.monthGZ % 12, idx: r.monthGZ };
    return {
      year: { g: yg, z: r.yearGZ % 12, idx: r.yearGZ },
      month: mg,
      day: { g: dg, z: r.dayZhi, idx: r.dayGZ },
      hour: hz === null ? null : { g: hourGan(dg, hz), z: hz },
      dayMaster: dg,
      yearText: r.yearGZText, monthText: r.monthGZText, dayText: r.dayGZText,
      hourText: hz === null ? '' : GAN[hourGan(dg, hz)] + ZHI[hz],
      jieqi: r.term ? r.term.name : '',
      /* 生肖按农历年（春节）定，与八字年柱（立春）分开，避免两套口径混用 */
      shengxiao: (function () {
        try {
          const lu = toLunar(gregorianToJDN(y, m, d));
          return (((lu.year - 1984) % 12) + 12) % 12;
        } catch (e) { return r.yearGZ % 12; }
      })()
    };
  }

  /* 旬空：由六十甲子序号定（与上方 xunKong 同义，保留此实现以免外部引用失配） */
  /* 注：原此处另有一份 function xunKong(idx)，因重复声明会覆盖前者，已删除；
     两式等价：[(10-2s)%12,(11-2s)%12] 与 [(start+10)%12,(start+11)%12]。 */

  const HE6 = [1, 0, 11, 10, 9, 8, 7, 6, 5, 4, 3, 2];
  const HAI6 = [7, 6, 5, 4, 3, 2, 1, 0, 11, 10, 9, 8];
  const XING_GROUP = (() => {
    const g = new Array(12).fill(-1);
    [0, 3].forEach(z => g[z] = 0);       // 子卯
    [2, 5, 8].forEach(z => g[z] = 1);    // 寅巳申
    [1, 10, 7].forEach(z => g[z] = 2);   // 丑戌未
    [4, 6, 9, 11].forEach(z => g[z] = 3); // 自刑
    return g;
  })();

  /* 当日（日柱）与命局四柱的关系 */
  function dayRelations(dayG, dayZ, bz) {
    const out = [];
    const pillars = [['年', bz.year], ['月', bz.month], ['日', bz.day]];
    if (bz.hour) pillars.push(['时', bz.hour]);
    for (const [label, p] of pillars) {
      if (dayZ === (p.z + 6) % 12) out.push({ type: '冲', pillar: label, text: '冲' + label + '柱' + ZHI[p.z] });
      if (dayZ === HE6[p.z]) out.push({ type: '合', pillar: label, text: '合' + label + '柱' + ZHI[p.z] });
      if (dayZ === HAI6[p.z]) out.push({ type: '害', pillar: label, text: '害' + label + '柱' + ZHI[p.z] });
      if (XING_GROUP[dayZ] >= 0 && XING_GROUP[dayZ] === XING_GROUP[p.z] && dayZ !== p.z && XING_GROUP[dayZ] !== 3)
        out.push({ type: '刑', pillar: label, text: '刑' + label + '柱' + ZHI[p.z] });
      if (dayZ === p.z && [4, 6, 9, 11].indexOf(dayZ) >= 0)
        out.push({ type: '自刑', pillar: label, text: '自刑（' + ZHI[dayZ] + '）' });
      /* 天克地冲：日课天干克命局天干（单向）＋ 日课地支冲命局地支
         择日之「天克地冲」专指日课克命；命克日课为「我克为财」，不作冲论 */
      if (dayZ === (p.z + 6) % 12 && KE(GAN_WX(dayG)) === GAN_WX(p.g))
        out.push({ type: '天克地冲', pillar: label, text: '天克地冲' + label + '柱（' + GAN[p.g] + ZHI[p.z] + '）' });
    }
    const shi = shiShen(bz.dayMaster, dayG);
    const kong = xunKong(bz.day.idx);
    return { list: out, shiShen: shi, kong: kong, kongHit: pillars.filter(pp => kong.indexOf(pp[1].z) >= 0).map(pp => pp[0]) };
  }

  /* ---------------- 五行旺衰与喜用（基础算法，非命理断言） ---------------- */
  const WX_NAME = ['木', '火', '土', '金', '水'];
  const ZHI_WX = [4, 2, 0, 0, 2, 1, 1, 2, 3, 3, 2, 4]; // 子水 丑土 寅木 卯木 辰土 巳火 午火 未土 申金 酉金 戌土 亥水

  /* 地支藏干（据《渊海子平·地支藏遁歌》，主气在前） */
  const ZHI_CANG = [
    [9],            // 子 癸
    [5, 7, 9],      // 丑 己 辛 癸
    [0, 2, 4],      // 寅 甲 丙 戊
    [1],            // 卯 乙
    [4, 1, 9],      // 辰 戊 乙 癸
    [2, 4, 6],      // 巳 丙 戊 庚
    [3, 5],         // 午 丁 己
    [5, 1, 3],      // 未 己 乙 丁
    [6, 8, 4],      // 申 庚 壬 戊
    [7],            // 酉 辛
    [4, 7, 3],      // 戌 戊 辛 丁
    [8, 0]          // 亥 壬 甲
  ];
  const CANG_W = w => w === 1 ? [1] : (w === 2 ? [0.7, 0.3] : [0.6, 0.25, 0.15]);

  function baziWuxing(bz) {
    const ps = [bz.year, bz.month, bz.day].concat(bz.hour ? [bz.hour] : []);
    const me = GAN_WX(bz.dayMaster);
    const shengMe = (me + 4) % 5, keMe = (me + 3) % 5, woKe = (me + 2) % 5, woSheng = (me + 1) % 5;

    const force = [0, 0, 0, 0, 0];
    const raw = [0, 0, 0, 0, 0];
    ps.forEach((p, i) => {
      const gw = GAN_WX(p.g);
      force[gw] += 1; raw[gw] += 1;
      const cang = ZHI_CANG[p.z], w = CANG_W(cang.length);
      const mul = (i === 1) ? 1.5 : 1;            // 月令加权
      cang.forEach((g, k) => {
        const ww = w[k] * mul;
        force[GAN_WX(g)] += ww;
        raw[GAN_WX(g)] += CANG_W(cang.length)[k];
      });
    });

    const total = force.reduce((a, b) => a + b, 0);
    const support = force[me] + force[shengMe];
    const ratio = support / total;

    /* 得令：月支主气与日主同类或生我 */
    const yueMain = GAN_WX(ZHI_CANG[bz.month.z][0]);
    const deLing = (yueMain === me || yueMain === shengMe);
    /* 得地：月支以外，地支藏干中有与日主同类者（通根） */
    let deDi = 0;
    ps.forEach((p, i) => {
      if (i === 1) return;
      if (ZHI_CANG[p.z].some(g => GAN_WX(g) === me)) deDi++;
    });
    /* 得势：天干（除日干）中同我或生我者 */
    let deShi = 0;
    ps.forEach((p, i) => {
      if (i === 2) return;
      const gw = GAN_WX(p.g);
      if (gw === me || gw === shengMe) deShi++;
    });

    const strong = ratio >= 0.5;
    /* 临界带：比例在 0.45–0.55，且「得令+得地+得势」与比例结论相反时不强判 */
    const deScore = (deLing ? 1 : 0) + deDi + deShi;
    const unclear = Math.abs(ratio - 0.5) <= 0.05 && ((strong && deScore <= 1) || (!strong && deScore >= 3));
    let fav = strong ? [keMe, woKe, woSheng] : [shengMe, me];
    let unf = strong ? [shengMe, me] : [keMe, woKe, woSheng];
    /* 原来的「冬取火、夏取水」粗调候已移除：它不看日主，且与《穷通宝鉴》逐月条文重复、
       常与旺衰相反（冬生火多者仍被加火为喜）。调候改由 tiaohouOf() 按原文逐格处理。 */
    const tiaohou = -1;
    unf = unf.filter(w => fav.indexOf(w) < 0);

    return {
      counts: raw.map(v => Math.round(v * 10) / 10),
      force: force.map(v => Math.round(v * 100) / 100),
      ratio: Math.round(ratio * 100) / 100,
      strong: strong, strengthText: unclear ? '强弱难定' : (strong ? '身强' : '身弱'), unclear: unclear,
      deLing: deLing, deDi: deDi, deShi: deShi, deScore: deScore,
      fav: fav, unf: unf, tiaohou: tiaohou,
      favText: fav.map(w => WX_NAME[w]).join('、'),
      unfText: unf.map(w => WX_NAME[w]).join('、')
    };
  }

  /* 当日干支五行对喜忌的粗打分（0–100）
     th（可选）：调候用神 { main, second } 五行序号——原文明定「主用／次用」者另行加权 */
  function scoreOf(dayGan, dayZhi, fav, unf, th) {
    let s = 50;
    const g = GAN_WX(dayGan), z = ZHI_WX[dayZhi];
    if (fav.indexOf(g) >= 0) s += 14; else if (unf.indexOf(g) >= 0) s -= 14;
    if (fav.indexOf(z) >= 0) s += 10; else if (unf.indexOf(z) >= 0) s -= 10;
    if (th) {
      if (th.main === g) s += 9; else if (th.main === z) s += 6;
      if (th.second === g) s += 5; else if (th.second === z) s += 3;
    }
    return Math.max(0, Math.min(100, Math.round(s)));
  }

  /* ---------------- 大运与流年 ---------------- */
  /* 阳年男／阴年女 顺行，其余逆行；出生到最近"节"的天数折合起运（三日一岁） */
  function qiYun(y, m, d, male) {
    const r0 = computeDay(y, m, d);
    const j0 = gregorianToJDN(y, m, d);
    const yangYear = (r0.yearGZ % 10) % 2 === 0;
    const forward = (yangYear && male) || (!yangYear && !male);
    let days = 15;
    for (let k = 1; k <= 40; k++) {
      const jj = forward ? j0 + k : j0 - k;
      const g = jdnToGregorian(jj);
      const r = computeDay(g.year, g.month, g.day);
      if (r.monthGZ.index !== r0.monthGZ.index) { days = k; break; }
    }
    return { forward: forward, days: days, startAge: days / 3 };
  }

  function daYun(y, m, d, male, count) {
    const q = qiYun(y, m, d, male);
    const r0 = computeDay(y, m, d);
    const out = [];
    const n = count || 8;
    for (let i = 1; i <= n; i++) {
      const idx = ((r0.monthGZ.index + (q.forward ? i : -i)) % 60 + 60) % 60;
      const ageStart = q.startAge + (i - 1) * 10;
      out.push({
        idx: idx,
        text: GAN[idx % 10] + ZHI[idx % 12],
        gan: idx % 10, zhi: idx % 12,
        from: Math.floor(ageStart), to: Math.floor(ageStart) + 10
      });
    }
    return { forward: q.forward, startAge: q.startAge, list: out };
  }

  function liuNian(year) {
    const r = computeDay(year, 6, 1);
    return { idx: r.yearGZ, text: r.yearGZText, gan: r.yearGZ % 10, zhi: r.yearGZ % 12 };
  }

  /* 月令取格（渊海子平：以日为主，先看提纲；月支取格，乃分贵贱） */
  /* 注意：劫财为月令时，阳干作「月刃格」，阴干无阳刃，只作「劫财格」（月劫） */
  const GE_NAME = {
    '正官': '正官格', '七杀': '偏官格', '正财': '正财格', '偏财': '偏财格',
    '食神': '食神格', '伤官': '伤官格', '正印': '印绶格', '偏印': '枭神格',
    '比肩': '建禄格', '劫财': '劫财格'
  };
  const LU_ZHI = [2, 3, 5, 6, 5, 6, 8, 9, 11, 0];   // 十干禄：甲寅 乙卯 丙巳 丁午 戊巳 己午 庚申 辛酉 壬亥 癸子
  function geJu(bz) {
    const me = bz.dayMaster, mz = bz.month.z;
    /* 建禄、月刃先于藏干取格 */
    if (mz === LU_ZHI[me]) {
      return { name: '建禄格', shiShen: '比肩', gan: me, by: '月令临官', zhi: mz, text: GAN[me] + ZHI[mz] };
    }
    if (me % 2 === 0 && mz === (LU_ZHI[me] + 1) % 12) {
      return { name: '月刃格', shiShen: '劫财', gan: me + 1, by: '月令帝旺', zhi: mz, text: GAN[me] + ZHI[mz] };
    }
    const cang = ZHI_CANG[mz];
    const gans = [bz.year.g, bz.month.g].concat(bz.hour ? [bz.hour.g] : []);
    const exposed = cang.filter(g => gans.indexOf(g) >= 0);
    const gan = exposed.length ? exposed[0] : cang[0];
    const shi = shiShen(me, gan);
    return {
      name: GE_NAME[shi] || shi,
      shiShen: shi,
      gan: gan,
      by: exposed.length ? '透干' : '本气',
      zhi: mz,
      text: GAN[gan] + ZHI[mz]
    };
  }

  /* 格局成败：据《渊海子平·看命口诀》「逢官看财，逢煞看印，逢印看官」等
     只在四柱十神齐备/冲突时给判断，不做旺衰以外的强弱推演 */
  function geJuStatus(bz, gj) {
    const me = bz.dayMaster;
    const ps = [bz.year, bz.month, bz.day].concat(bz.hour ? [bz.hour] : []);
    const has = {};                       // 十神 → 出现次数
    const add = g => { const s = shiShen(me, g); has[s] = (has[s] || 0) + 1; };
    ps.forEach(p => { add(p.g); ZHI_CANG[p.z].forEach(add); });
    const hasAny = arr => arr.some(s => has[s]);
    const tou = {};
    ps.forEach(p => { const k = shiShen(me, p.g); tou[k] = (tou[k] || 0) + 1; });
    const touAny = arr => arr.some(s => tou[s]);

    const reasons = [];
    let verdict = '平';
    let bing = null, yao = null, yaoBy = '';
    const name = gj.name;

    if (name === '正官格') {
      if (touAny(['伤官'])) { verdict = '破'; reasons.push('伤官见官，格破'); bing = '伤官'; yao = '正印'; yaoBy = '印制伤官'; }
      else if (hasAny(['正财', '偏财'])) { verdict = '成'; reasons.push('逢官看财，财生官'); }
      if (touAny(['七杀'])) { verdict = verdict === '成' ? '平' : '破'; reasons.push('官杀混杂'); bing = bing || '七杀'; yao = yao || '食神'; yaoBy = yaoBy || '食神制杀'; }
    } else if (name === '偏官格') {
      if (hasAny(['食神', '正印', '偏印'])) { verdict = '成'; reasons.push('煞看印、食神制杀'); }
      if (hasAny(['正财', '偏财']) && !hasAny(['食神', '正印', '偏印'])) { verdict = '破'; reasons.push('财生煞而无制'); bing = '正财'; yao = '比肩'; yaoBy = '比劫制财'; }
    } else if (name === '正财格' || name === '偏财格') {
      if (touAny(['比肩', '劫财'])) { verdict = '破'; reasons.push('比劫夺财'); bing = '比肩'; yao = '正官'; yaoBy = '官杀制比劫'; }
      else if (hasAny(['食神', '伤官'])) { verdict = '成'; reasons.push('食伤生财'); }
    } else if (name === '印绶格' || name === '枭神格') {
      if (touAny(['正财', '偏财'])) { verdict = '破'; reasons.push('财破印'); bing = '正财'; yao = '比肩'; yaoBy = '比劫制财'; }
      else if (hasAny(['正官', '七杀'])) { verdict = '成'; reasons.push('逢印看官，官印相生'); }
    } else if (name === '食神格') {
      if (touAny(['偏印'])) { verdict = '破'; reasons.push('枭神夺食'); bing = '偏印'; yao = '正财'; yaoBy = '财制枭印'; }
      else if (hasAny(['正财', '偏财'])) { verdict = '成'; reasons.push('食神生财'); }
    } else if (name === '伤官格') {
      if (touAny(['正官'])) { verdict = '破'; reasons.push('伤官见官'); bing = '伤官'; yao = '正印'; yaoBy = '印制伤官'; }
      else if (hasAny(['正财', '偏财'])) { verdict = '成'; reasons.push('伤官生财'); }
    } else if (name === '建禄格' || name === '月刃格') {
      if (hasAny(['正财', '偏财', '正官', '七杀'])) { verdict = '成'; reasons.push('禄刃喜财官'); }
      else { verdict = '平'; reasons.push('禄刃无财官可依'); }
    }

    /* 月支被冲，格根受损 */
    const chong = ps.some(p => p.z === (bz.month.z + 6) % 12);
    if (chong) { reasons.push('月令被冲，格根不稳'); if (verdict === '成') verdict = '平'; }

    return { verdict: verdict, reasons: reasons, name: name, bing: bing, yao: yao, yaoBy: yaoBy };
  }

  /* 十二长生：阳干顺行、阴干逆行
     长生起点：甲亥 乙午 丙寅 丁酉 戊寅 己酉 庚巳 辛子 壬申 癸卯 */
  const CS_NAMES = ['长生', '沐浴', '冠带', '临官', '帝旺', '衰', '病', '死', '墓', '绝', '胎', '养'];
  const CS_START = [11, 6, 2, 9, 2, 9, 5, 0, 8, 3];
  function changSheng(gan, zhi) {
    const start = CS_START[gan];
    const idx = (gan % 2 === 0) ? ((zhi - start + 12) % 12) : ((start - zhi + 12) % 12);
    return CS_NAMES[idx];
  }

  /* 六亲：据《渊海子平》论父/论母/论妻妾/论子息
     父=偏财　母=正印　兄弟=比肩劫财　男命妻=正财、子=七杀、女=正官；女命夫=正官、子=伤官、女=食神 */
  function liuQin(bz, male) {
    const me = bz.dayMaster;
    const ps = [bz.year, bz.month, bz.day].concat(bz.hour ? [bz.hour] : []);
    const labels = ['年', '月', '日', '时'];
    /* 记录每个十神第一次出现的位置：{ pos, gan, zhi } */
    const where = {};
    ps.forEach((p, i) => {
      const s = shiShen(me, p.g);
      if (i !== 2 && !where[s]) where[s] = { pos: labels[i] + '干', gan: p.g, zhi: p.z, tou: true };
      ZHI_CANG[p.z].forEach(g => {
        const t = shiShen(me, g);
        if (!where[t]) where[t] = { pos: labels[i] + '支藏' + GAN[g], gan: g, zhi: p.z, tou: false };
      });
    });
    const rows = [
      { role: '父', shi: ['偏财'] },
      { role: '母', shi: ['正印'] },
      { role: '兄弟', shi: ['比肩', '劫财'] },
      male ? { role: '妻', shi: ['正财'] } : { role: '夫', shi: ['正官'] },
      male ? { role: '子', shi: ['七杀'] } : { role: '子', shi: ['伤官'] },
      male ? { role: '女', shi: ['正官'] } : { role: '女', shi: ['食神'] }
    ];
    return rows.map(r => {
      let hit = null;
      for (const s of r.shi) if (where[s]) { hit = where[s]; break; }
      return {
        role: r.role,
        shi: r.shi.join('/'),
        status: hit ? (hit.tou ? '透干' : '藏干') : '无',
        stage: hit ? changSheng(hit.gan, hit.zhi) : '',
        pos: hit ? hit.pos : ''
      };
    });
  }

  /* 大运／流年吉凶：喜忌 + 长生 + 冲刑命局（本程序自定口径） */
  function yunScore(gan, zhi, bz, fav, unf) {
    let s = 50;
    const g = GAN_WX(gan), z = ZHI_WX[zhi];
    if (fav && fav.indexOf(g) >= 0) s += 12; else if (unf && unf.indexOf(g) >= 0) s -= 12;
    if (fav && fav.indexOf(z) >= 0) s += 10; else if (unf && unf.indexOf(z) >= 0) s -= 10;
    const cs = changSheng(bz.dayMaster, zhi);
    if (cs === '长生' || cs === '临官' || cs === '帝旺') s += 8;
    else if (cs === '死' || cs === '墓' || cs === '绝') s -= 8;
    const ps = [bz.year, bz.month, bz.day].concat(bz.hour ? [bz.hour] : []);
    ps.forEach(p => {
      if (zhi === (p.z + 6) % 12) s -= 6;
      else if (XING_GROUP[zhi] >= 0 && XING_GROUP[zhi] === XING_GROUP[p.z] && zhi !== p.z && XING_GROUP[zhi] !== 3) s -= 3;
    });
    return { score: Math.max(0, Math.min(100, Math.round(s))), stage: cs };
  }

  /* 取用神（相神）：据《渊海子平·看命口诀》「逢官看财，逢煞看印，逢印看官」一路 */
  function yongShen(gj) {
    const R = {
      '正官格': { shi: '正财', by: '逢官看财' },
      '偏官格': { shi: '正印', by: '逢煞看印' },
      '印绶格': { shi: '正官', by: '逢印看官' },
      '枭神格': { shi: '正官', by: '逢印看官' },
      '正财格': { shi: '食神', by: '财喜食生' },
      '偏财格': { shi: '食神', by: '财喜食生' },
      '食神格': { shi: '正财', by: '食神生财' },
      '伤官格': { shi: '正财', by: '伤官生财' },
      '建禄格': { shi: '正财', by: '禄喜财官' },
      '月刃格': { shi: '七杀', by: '刃喜杀制' }
    };
    const r = R[gj.name];
    return r ? { shi: r.shi, by: r.by, name: gj.name } : null;
  }

  /* 合婚：男命先、女命后。分数＝50 底分＋各项加减（权重本程序自定） */
  function hehun(bzM, bzF) {
    const items = [];
    const add = (t, ok, note, d) => items.push({ t: t, ok: ok, note: note, d: d });
    const zhiRel = (x, y) => {
      if (HE6[x] === y) return { k: '六合', d: 12 };
      if (sanheGroup(x) === sanheGroup(y) && x !== y) return { k: '三合', d: 10 };
      if ((x + 6) % 12 === y) return { k: '相冲', d: -15 };
      if (XING_GROUP[x] === 3 && x === y) return { k: '自刑', d: -6 };
      if (XING_GROUP[x] >= 0 && XING_GROUP[x] === XING_GROUP[y] && x !== y && XING_GROUP[x] !== 3) return { k: '相刑', d: -8 };
      if (HAI6[x] === y) return { k: '相害', d: -6 };
      if (x === y) return { k: '同支', d: 4 };
      return { k: '', d: 0 };
    };
    const wm = baziWuxing(bzM), wf = baziWuxing(bzF);

    /* 1 日支（夫妻宫）*/
    const r1 = zhiRel(bzM.day.z, bzF.day.z);
    add('夫妻宫（日支）', r1.d > 0, ZHI[bzM.day.z] + ' 与 ' + ZHI[bzF.day.z] + (r1.k ? ' ' + r1.k : ' 无刑冲合害'), r1.d);
    /* 2 年支（生肖）*/
    const r2 = zhiRel(bzM.shengxiao, bzF.shengxiao);
    add('生肖（春节口径）', r2.d > 0, ZHI[bzM.shengxiao] + ' 与 ' + ZHI[bzF.shengxiao] + (r2.k ? ' ' + r2.k : ' 无刑冲合害'), Math.round(r2.d * 0.6));
    /* 3 日主五行 */
    const am = GAN_WX(bzM.dayMaster), af = GAN_WX(bzF.dayMaster);
    const SHENG = i => (i + 1) % 5;
    if (am === af) add('日主同气', true, WX_NAME[am] + ' 与 ' + WX_NAME[af] + ' 同类，性情相近', 5);
    else if (SHENG(am) === af || SHENG(af) === am)
      add('日主相生', true, WX_NAME[am] + ' 与 ' + WX_NAME[af] + ' 相生，彼此有助', 8);
    else add('日主相克', false, WX_NAME[am] + ' 与 ' + WX_NAME[af] + ' 相克，易有拉扯', -8);
    /* 4 五行互补：一方所喜，是否为对方命中所旺 */
    const comp = (wa, wb, who) => {
      let n = 0;
      (wa.fav || []).forEach(w => { if ((wb.counts[w] || 0) >= 0.6 && n < 2) n++; });
      if (n) add('五行互补', true, who + '所喜的 ' + (wa.fav || []).map(w => WX_NAME[w]).join('') + '，对方命中有', n * 4);
      return n * 4;
    };
    const c1 = comp(wm, wf, '男方'); const c2 = comp(wf, wm, '女方');
    if (!c1 && !c2) add('五行互补', false, '两人所喜五行彼此都不旺，需靠相处与后天补', 0);
    /* 5 夫妻星 */
    const hasShi = (bz, names) => {
      const me = bz.dayMaster;
      const ps = [bz.year, bz.month, bz.day].concat(bz.hour ? [bz.hour] : []);
      for (const p of ps) {
        if (names.indexOf(shiShen(me, p.g)) >= 0) return '透干';
        for (const g of ZHI_CANG[p.z]) if (names.indexOf(shiShen(me, g)) >= 0) return '藏干';
      }
      return '';
    };
    const qm = hasShi(bzM, ['正财', '偏财']);
    const qf = hasShi(bzF, ['正官', '七杀']);
    add('男命妻星', !!qm, qm ? '财星' + qm + '（妻星有力）' : '财星不现，妻缘需主动经营', qm === '透干' ? 5 : qm ? 3 : 0);
    add('女命夫星', !!qf, qf ? '官星' + qf + '（夫星有力）' : '官星不现，夫缘需慢慢遇', qf === '透干' ? 5 : qf ? 3 : 0);
    /* 6 强弱搭配 */
    if (wm.strong !== wf.strong) add('强弱互补', true, '一强一弱，主导与配合容易分工', 4);
    else add('强弱同调', wm.strong ? false : true, wm.strong ? '两人都偏强，容易各执一词' : '两人都偏弱，遇事易互相等待', wm.strong ? -3 : -2);

    let sum = 50;
    for (const it of items) sum += it.d;
    sum = Math.max(0, Math.min(100, Math.round(sum)));
    let grade = '一般';
    if (sum >= 80) grade = '很合';
    else if (sum >= 65) grade = '较合';
    else if (sum >= 50) grade = '一般';
    else if (sum >= 35) grade = '需磨合';
    else grade = '多阻';
    return { score: sum, grade: grade, items: items, wxM: wm, wxF: wf };
  }

  /* 流月：按节气月取 12 个干支（取每月 15 日为样本日，月柱已按节分） */
  function liuYue(year) {
    const out = [];
    for (let m = 1; m <= 12; m++) {
      const r = computeDay(year, m, 15);
      out.push({ month: m, gan: r.monthGZ.stem, zhi: r.monthGZ.branch, text: GAN[r.monthGZ.stem] + ZHI[r.monthGZ.branch] });
    }
    return out;
  }

  /* 小运：据《渊海子平·论行小运法》「男一岁起丙寅顺行，女一岁起壬申逆行」 */
  function xiaoYun(age, male) {
    const n = Math.max(1, age) - 1;
    const idx = male ? ((2 + n) % 60) : ((8 - n) % 60 + 60) % 60;
    return { idx: idx, gan: idx % 10, zhi: idx % 12, text: GAN[idx % 10] + ZHI[idx % 12], age: age };
  }

  return {
    gregorianToJDN, jdnToGregorian, toLunar, lunarToJDN, lunarMonthsOf, computeDay,
    baziOf, shiShen, dayRelations, xunKong, baziWuxing, scoreOf, WX_NAME, ZHI_WX, ZHI_CANG,
    geJu, geJuStatus, liuQin, changSheng, CS_NAMES, yunScore, yongShen, liuYue, xiaoYun, hehun, solarTermInstant, termInHour,
    qiYun, daYun, liuNian,
    sunLongitude, solarTermJDN, TERM_NAMES, newMoonJDN,
    GAN, ZHI, ANIMALS, JIANCHU, ORDER, GLOSS, JIANCHU_DATA, deltaT
  };
});

  "text": "六月辛金，己土当权，辅助太多，恐掩金光，先用壬水，取庚佐之，壬庚两透，科甲功名，即不出干，藏支得所，亦有荣华，但忌戊出，得甲制之，方吉，甲须隔位，恐贪己合，反掩金光，又寒壬水之流，下贱之格，又忌庚出制甲，或只有未中一己，见子壬水，又为湿泥，不可见甲，甲出，反作平人，总以一壬一己，见庚无甲，方妙，与五月用己壬同。",

 "辛|八月": {

 "辛|九月": {

  "text": "九月辛金，成土司令，母旺子相，须甲疏土，壬泄旺金，先壬後甲，壬甲两透，桃洞之仙，或壬透甲藏，又见者，平人，甲透，壬藏，戊在支内，异途之仕。",

 "辛|十月": {

 "癸|六月": {
  "exact": true,
  "text": "六月癸水，有上下月之分，下半月庚辛有气，上半月庚辛休囚，凡六癸日，多不验者，何也，俗士不知此理，因未中有乙巳同宫，破而不破，故癸水不能从杀，所以专用庚辛，如上半月金神衰弱，火气炎烈，宜比劫助身，可云富贵，与五月一理，下半月庚辛有气，即无比劫亦可，又忌丁透，即丁在支亦不吉，其生克制化，与五月略同。",

   "辛"
  ]

 "癸|七月": {
  "exact": true,
  "text": "七月癸水，正母旺子相之时，癸虽死申，殊不知申中有庚生之，名死处逢生，弱中复强，即运行西北，亦不死也，但庚司令，刚锐极矣，必取丁火为用，或丁透有甲，名有焰之火，必主科甲，或丁透无甲，又无壬癸，即有一二庚金，亦有生监，有二丁更妙，或金多乏丁制者，贫困之人。",
  "juan": "卷六·论水",

  ]
 },
 "癸|八月": {
  "exact": true,
  "text": "八月癸水，辛金虚灵，非顽金可比，正金白水清，故取辛金为用，丙火佐之，名水暖金温，如丙与辛隔位同透，主科甲功名，或丙透辛藏，一榜之士，或土多克水，生意中心，八月癸水，丙辛怕用。",
  "juan": "卷六·论水",
  "sec": "八月癸水",
  "use": [
   "辛"
  ]
 },
 "癸|九月": {
  "exact": true,
  "text": "九月癸水，失令无根，戊土司权，克制太过，专用辛金发水之源，要比肩滋甲制戊方妙。",

 "癸|十月": {
  "exact": true,
  "text": "十月癸水，旺中有弱，何也，因亥摇木，泄散元神，宜用庚辛为妙，得庚辛两透，不见丁伤者，功名有准。",

 "癸|十一月": {
  "exact": true,
  "text": "十一月癸水，值冰冻之时，金水无交欢之象，专用丙火解冻，庶不致成冰，又要辛金滋扶，无丙有辛，不妙，凡冬季癸水，有丙透解冻，则金温水暖，两两相生，要不见壬透，自然登科及第，紫诰金章。",
  "juan": "卷六·论水",
  "sec": "十一月癸水",

 },
 "癸|十二月": {
  "exact": true,
  "text": "十二月癸水，寒极成冰，万物不能舒泰，宜丙火解冻，或丙透年时，加以壬透，支中多戊，名水辅阳光，主显达名臣，无戊者，异途之职，若有丙无壬，黉门之客，有壬无丙，戊又出干者，皂隶之流。",

  /* 用 SVG 排版再栅格化：比直接 canvas 画中文可靠 */
  function makePoster(r, score, rel) {
    var secs = posterSections(r, score, rel);
    S.posterText = posterTextOf(secs);

    var W = 750, PAD = 46, MAXW = W - PAD * 2;
    /* 估算字宽：中文按字号，英文数字按 0.56 */
    function cw(ch, fs) { return /[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]/.test(ch) ? fs : fs * 0.56; }
    function wrapBy(text, fs, maxW) {
      var out = [], cur = '', w = 0;
      for (var i = 0; i < text.length; i++) {
        var c = text[i], cwid = cw(c, fs);
        if (w + cwid > maxW && cur) { out.push(cur); cur = c; w = cwid; }
        else { cur += c; w += cwid; }
      }
      if (cur) out.push(cur);
      return out;
    }

    var items = [];   /* {text, fs, color, bold, align, yy} */
    var y = 96;
    secs.forEach(function (s) {
      if (s.t === 'hr') { y += 16; return; }
      var fs, color, bold = false, align = 'left';
      if (s.t === 'h1') { fs = 30; color = '#7A6A52'; bold = true; align = 'center'; }
      else if (s.t === 'sub') { fs = 19; color = '#7A6A52'; align = 'center'; }
      else if (s.t === 'day') { fs = 52; color = '#B3202A'; bold = true; align = 'center'; }
      else if (s.t === 'meta') { fs = 21; color = '#4A4239'; align = 'center'; }
      else { fs = 22; color = '#3A342C'; }

      if (s.t === 'kv') {
        var kw = 0;
        for (var i = 0; i < s.k.length + 1; i++) kw += cw(i < s.k.length ? s.k[i] : '：', fs);
        var lines = wrapBy(s.v, fs, MAXW - kw);
        items.push({ text: s.k + '：', fs: fs, color: '#A2968A', bold: true, x: PAD, yy: y });
        lines.forEach(function (ln, idx) {
          items.push({ text: ln, fs: fs, color: color, x: PAD + kw, yy: y + idx * 33 });
        });
        y += Math.max(1, lines.length) * 33;
      } else {
        var ls = wrapBy(s.s, fs, MAXW);
        var lh = s.t === 'day' ? 66 : (s.t === 'h1' ? 44 : 30);
        ls.forEach(function (ln, idx) {
          items.push({ text: ln, fs: fs, color: color, bold: bold, align: align, yy: y + idx * lh });
        });
        y += ls.length * lh;
      }
    });

    var H = Math.max(880, y + 110);
    S.posterMeta = 'secs=' + secs.length + ' items=' + items.length + ' H=' + H;

    var esc2 = function (t) {
      return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    };
    var svg = ['<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">',
      '<rect width="' + W + '" height="' + H + '" fill="#F7F2E9"/>',
      '<rect x="24" y="24" width="' + (W - 48) + '" height="' + (H - 48) + '" fill="none" stroke="#DCCBA6" stroke-width="3"/>'];
    items.forEach(function (it) {
      var anchor = it.align === 'center' ? 'middle' : 'start';
      var xpos = it.align === 'center' ? W / 2 : (it.x || PAD);
      svg.push('<text x="' + xpos + '" y="' + it.yy + '" fill="' + it.color + '" font-size="' + it.fs + '"' +
        ' font-family="PingFang SC,Heiti SC,Songti SC,SimSun,serif"' +
        (it.bold ? ' font-weight="600"' : '') + ' text-anchor="' + anchor + '">' + esc2(it.text) + '</text>');
    });
    svg.push('<text x="' + (W / 2) + '" y="' + (H - 56) + '" fill="#A2968A" font-size="18" text-anchor="middle" font-family="PingFang SC,sans-serif">协纪黄历 · 传统历法资料，仅供参考</text>');
    svg.push('<text x="' + (W / 2) + '" y="' + (H - 28) + '" fill="#A2968A" font-size="18" text-anchor="middle" font-family="PingFang SC,sans-serif">wincard8.github.io/huangli</text>');
    svg.push('</svg>');

    /* 同步返回一个占位：真正的 PNG 由异步栅格化替换 */
    try {
      var blobUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.join(''));
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');

        var cx = c.getContext('2d');

        S.poster = c.toDataURL('image/png');

      };
      img.src = blobUrl;
    } catch (e) { }
    return blobUrl;
  }

  function displayLists(r) {

    var jiLabel = {}, yiLabel = {};
    ji.forEach(function (x) { jiLabel[x.m] = 1; });
    yi.forEach(function (x) { yiLabel[x.m] = 1; });

    var both = yi.filter(function (x) { return jiLabel[x.m]; });
    var bothCount = both.length;

    if (pol === 'yi') {

      ji = ji.filter(function (x) { return !yiLabel[x.m]; });
    } else {
      /* 上次「不遇」、中次「遇德」等"从宜亦从忌"者，以及从忌不从宜：

      yi = yi.filter(function (x) { return !jiLabel[x.m]; });

  var COMMON = ['嫁娶', '开市', '般移', '求医', '入学', '裁制', '安床', '祭祀', '祈福', '求嗣', '立券', '交易',

  function sortCommon(a, b) {

  /* ---------------- .ics 导出 ---------------- */
  var ENC = (typeof TextEncoder !== 'undefined') ? new TextEncoder() : null;
  function bytesOf(ch) { return ENC ? ENC.encode(ch).length : (ch.charCodeAt(0) > 127 ? 3 : 1); }
  function icsEsc(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }
  function icsFold(line) {
    var out = [], cur = '', b = 0;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i), n = bytesOf(ch);
      if (b + n > 73) { out.push(cur); cur = ' '; b = 1; }
      cur += ch; b += n;
    }
    out.push(cur);
    return out.join('\r\n');
  }
  function ymd(jdn) {
    var g = E.jdnToGregorian(jdn);
    return g.year + pad(g.month) + pad(g.day);
  }
  function buildICS(days) {
    var t = new Date();
    var stamp = t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + 'T' +
      pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + pad(t.getUTCSeconds()) + 'Z';
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Xieji Huangli//CN', 'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH', 'X-WR-CALNAME:协纪黄历', 'X-WR-TIMEZONE:Asia/Shanghai'];
    var base = E.gregorianToJDN(S.y, S.m, S.d);
    for (var i = 0; i < days; i++) {
      var jdn = base + i, g = E.jdnToGregorian(jdn), r;
      try { r = E.computeDay(g.year, g.month, g.day); } catch (e) { continue; }
      var yi = modern(r.yi).sort(sortCommon).map(function (x) { return x.m; });
      var ji = modern(r.ji).sort(sortCommon).map(function (x) { return x.m; });
      var sum = lunarText(r) + (yi.length ? ' 宜' + yi.slice(0, 3).join('·') : '') + (ji.length ? ' 忌' + ji.slice(0, 2).join('·') : '');
      var desc = [
        yi.length ? '宜：' + yi.join(' ') : '宜：诸事不宜',
        ji.length ? '忌：' + ji.join(' ') : '忌：无忌',
        '建除：' + r.jianchuName + ' · ' + r.levelText,
        '干支：' + r.yearGZText + '年 ' + r.monthGZText + '月 ' + r.dayGZText + '日',
        '神煞：' + r.shensha.map(function (s) { return s.name; }).join('、'),
        '依《钦定协纪辨方书》卷十「宜忌」'
      ].join('\n');
      L.push('BEGIN:VEVENT', 'UID:' + ymd(jdn) + '@xieji-huangli', 'DTSTAMP:' + stamp,
        'DTSTART;VALUE=DATE:' + ymd(jdn), 'DTEND;VALUE=DATE:' + ymd(jdn + 1),
        icsFold('SUMMARY:' + icsEsc(sum)), icsFold('DESCRIPTION:' + icsEsc(desc)),
        'TRANSP:TRANSPARENT', 'CATEGORIES:黄历', 'END:VEVENT');
    }
    L.push('END:VCALENDAR');
    return L.join('\r\n') + '\r\n';
  }
  var VTIMEZONE = ['BEGIN:VTIMEZONE', 'TZID:Asia/Shanghai', 'BEGIN:STANDARD', 'DTSTART:19700101T000000',
    'TZOFFSETFROM:+0800', 'TZOFFSETTO:+0800', 'TZNAME:CST', 'END:STANDARD', 'END:VTIMEZONE'];
  function icsTime(jdn, hh) { return ymd(jdn) + 'T' + pad(hh) + '0000'; }

  function buildHoursICS(days, mode) {
    var t = new Date();
    var stamp = t.getUTCFullYear() + pad(t.getUTCMonth() + 1) + pad(t.getUTCDate()) + 'T' +
      pad(t.getUTCHours()) + pad(t.getUTCMinutes()) + pad(t.getUTCSeconds()) + 'Z';
    var L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Xieji Huangli//CN', 'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH', 'X-WR-CALNAME:协纪时辰', 'X-WR-TIMEZONE:Asia/Shanghai',
      'X-WR-CALDESC:十二时辰吉凶与宜忌（定时事件）'].concat(VTIMEZONE);
    var base = E.gregorianToJDN(S.y, S.m, S.d), count = 0;
    for (var i = 0; i < days; i++) {
      var jdn = base + i, g = E.jdnToGregorian(jdn), r;
      try { r = E.computeDay(g.year, g.month, g.day); } catch (e) { continue; }
      var list = r.hours.filter(function (h) {
        return mode === 'all' || (mode === 'good' ? h.good === '吉' : h.good !== '吉');
      }).map(function (h) { return { h: h, startH: (2 * h.branch + 23) % 24 }; })
        .sort(function (a, b) { return a.startH - b.startH; });
      list.forEach(function (it) {
        var h = it.h, startH = it.startH;
        var endJdn = startH === 23 ? jdn + 1 : jdn;
        var endH = (startH + 2) % 24;
        var yi = modern(h.yi).sort(sortCommon).map(function (x) { return x.m; });
        var ji = modern(h.ji).sort(sortCommon).map(function (x) { return x.m; });
        var head = yi.slice(0, 2).join('·');
        var sum = h.gz + '时 ' + h.good + ' ' + h.shen + (head ? ' 宜' + head : '');
        var desc = [
          '值神：' + h.shen + (h.godGood ? '（黄道）' : '（黑道）'),
          '冲' + h.chongName + ' · 煞' + h.sha + (h.marks.length ? ' · ' + h.marks.join('·') : ''),
          yi.length ? '宜：' + yi.join(' ') : '宜：诸事不宜（日破时）',
          ji.length ? '时忌：' + ji.join(' ') : '时忌：无',
          r.ji.length ? '日忌（前八项）：' + modern(r.ji).sort(sortCommon).slice(0, 8).map(function (x) { return x.m; }).join(' ') + ' …' : '日忌：无',
          '建除：' + r.jianchuName + ' · ' + r.levelText + ' · ' + r.dayGZText + '日',
          '依《钦定协纪辨方书》卷十「宜忌」'

        L.push('BEGIN:VEVENT', 'UID:' + ymd(jdn) + 'T' + pad(startH) + '-' + h.branch + '@xieji-shichen',
          'DTSTAMP:' + stamp,
          'DTSTART;TZID=Asia/Shanghai:' + icsTime(jdn, startH),
          'DTEND;TZID=Asia/Shanghai:' + icsTime(endJdn, endH),
          icsFold('SUMMARY:' + icsEsc(sum)), icsFold('DESCRIPTION:' + icsEsc(desc)),
          'TRANSP:TRANSPARENT', 'CATEGORIES:时辰', 'END:VEVENT');
        count++;
      });
    }
    L.push('END:VCALENDAR');
    return { text: L.join('\r\n') + '\r\n', count: count };
  }

  function downloadBlob(text, name) {

    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }

  function findGoodMonth(th, ym) {
    var p = ym.split('-').map(Number), y = p[0], m = p[1];

    var nm = (m === 12) ? [y + 1, 1] : [y, m + 1];
    var end = E.gregorianToJDN(nm[0], nm[1], 1);
    var out = [];
    for (var j = start; j < end; j++) {
      var g = E.jdnToGregorian(j), r;
      try { r = E.computeDay(g.year, g.month, g.day); } catch (e) { continue; }
      var hit = th.k.filter(function (k) { return r.yi.indexOf(k) >= 0 && r.ji.indexOf(k) < 0; });
      if (!hit.length) continue;
      out.push({
        y: g.year, m: g.month, d: g.day, gz: r.dayGZText, jc: r.jianchuName, lv: r.levelText,
        week: '星期' + r.week, lunar: lunarText(r), n: hit.length, sc: thingScore(r, th)
      });
    }
    return out.sort(function (a, b) {
      if (a.sc != null && b.sc != null && a.sc !== b.sc) return b.sc - a.sc;
      return 0;
    });
  }

  function findGood(th, days) {

      var hit = th.k.filter(function (k) { return r.yi.indexOf(k) >= 0 && r.ji.indexOf(k) < 0; });
      if (!hit.length) continue;
      var rl = dayRelBad(r);

      out.push({
        y: g.year, m: g.month, d: g.day, gz: r.dayGZText, jc: r.jianchuName, lv: r.levelText,
        week: '星期' + r.week, lunar: lunarText(r), n: hit.length, sc: thingScore(r, th), rel: rl
      });
